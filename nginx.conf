# Nginx production configuration snippet for Jyotika Spa (Vite + React Router SPA)
server {
    listen 80;
    server_name jyotika.online www.jyotika.online;
    root /var/www/jyotika/dist;
    index index.html;

    # Serve static assets directly with long-term cache
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|webp)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Serve robots.txt, sitemap.xml & brand assets directly
    location = /robots.txt { allow all; log_not_found off; access_log off; }
    location = /sitemap.xml { allow all; log_not_found off; access_log off; }
    location = /favicon.svg { allow all; log_not_found off; access_log off; }
    location = /og-image.jpg { allow all; log_not_found off; access_log off; }

    # Fallback all React SPA routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
